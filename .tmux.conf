# ~/.tmux.conf
# Reload with: tmux source-file ~/.tmux.conf  (or prefix + r once loaded)

# ---------- General ----------
# Use Ctrl-a as prefix (easier reach than Ctrl-b, matches GNU screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # pass Ctrl-a through to apps when pressed twice

# Start window & pane numbering at 1 (0 is far from 1 on the keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on    # renumber windows when one is closed

# More history, faster key response, true color
set -g history-limit 50000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g focus-events on        # forward focus in/out to apps (nvim autoread, gitsigns refresh)

# Mouse support (scroll, resize, select panes)
set -g mouse on

# ---------- Reload config ----------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ---------- Splits ----------
# More intuitive than % and " — and open new panes in the current path
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# ---------- Pane resizing (repeatable: hold the key after prefix) ----------
bind -n M-h resize-pane -L 3 
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

# ---------- Window navigation ----------
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window           # quickly toggle between two windows

# ---------- Copy mode (vim keys) ----------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ---------- Status bar ----------
#set -g status-position top
#set -g status-interval 5
#set -g status-style "bg=default,fg=white"
#set -g status-left  "#[fg=green,bold][#S] "
#set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M"
#set -g status-left-length 40
#
#setw -g window-status-current-style "fg=black,bg=green,bold"
#setw -g window-status-current-format " #I:#W "
#setw -g window-status-format " #I:#W "

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-bg        '#141414'
set -g @tmux-dotbar-fg        '#444649'
set -g @tmux-dotbar-fg-current '#feffd3'
set -g @tmux-dotbar-fg-session '#8a989a'
set -g @tmux-dotbar-fg-prefix  '#dd7c4c'
#set -g @plugin "nordtheme/tmux"

# Claude usage indicator (right side of dotbar)
set -g status-interval 30
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right "#(~/.config/tmux/scripts/claude-usage.py)"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
